# 예약 게시 — 10분마다 publishAt 이 지난 pending 항목을 인스타 릴스로 게시한다.
# GitHub cron 은 5~15분 늦을 수 있다 → publishAt 은 "이 시각 이후" 의 의미.
name: publish-due
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "특정 항목만 (remotion-<channel>-<number>[-lang]). 비우면 --due"
        required: false
        type: string
      dry_run:
        description: "점검만 (게시 안 함)"
        required: false
        type: boolean
        default: false
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # IG 시크릿은 아래 마커 사이를 tools/gen-formats.mjs 가 formats/*.json 에서 자동 생성한다 (손대지 말 것).
      # (toJSON(secrets) 로 통째로 넘기면 GitHub 이 "악성 가능성" 으로 실행을 막는다 — 2026-09-22 확인)
      # --- IG secrets (gen-formats) ---
      IG_GOODMOVIES_JA: ${{ secrets.IG_GOODMOVIES_JA }}
      IG_GOODMOVIES_TH: ${{ secrets.IG_GOODMOVIES_TH }}
      IG_GOODMOVIES_TW: ${{ secrets.IG_GOODMOVIES_TW }}
      IG_GOODMOVIES_VI: ${{ secrets.IG_GOODMOVIES_VI }}
      IG_GOODVIBESONGS_JA: ${{ secrets.IG_GOODVIBESONGS_JA }}
      IG_READYACTION_JA: ${{ secrets.IG_READYACTION_JA }}
      IG_READYACTION_TH: ${{ secrets.IG_READYACTION_TH }}
      IG_READYACTION_TW: ${{ secrets.IG_READYACTION_TW }}
      IG_READYACTION_VI: ${{ secrets.IG_READYACTION_VI }}
      IG_SPACE_LAB_JA: ${{ secrets.IG_SPACE_LAB_JA }}
      IG_SPACE_LAB_TH: ${{ secrets.IG_SPACE_LAB_TH }}
      IG_SPACE_LAB_TW: ${{ secrets.IG_SPACE_LAB_TW }}
      IG_SPACE_LAB_VI: ${{ secrets.IG_SPACE_LAB_VI }}
      IG_THISHIPHOP_JA: ${{ secrets.IG_THISHIPHOP_JA }}
      # --- end IG secrets ---
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=@wayclip/publisher --workspace=@wayclip/shared --include-workspace-root=false
      # 안전장치: 레포 변수 PUBLISH_DRY_RUN=true 면 cron 포함 모든 실행이 점검 모드(실게시 없음).
      #   켜기: gh variable set PUBLISH_DRY_RUN --body true   /  끄기: gh variable delete PUBLISH_DRY_RUN
      - name: 게시
        env:
          DRY: ${{ (inputs.dry_run == true || vars.PUBLISH_DRY_RUN == 'true') && '--dry-run' || '' }}
        run: |
          [ -n "$DRY" ] && echo "::notice::점검 모드(dry-run) — 실게시 없음 (PUBLISH_DRY_RUN=${{ vars.PUBLISH_DRY_RUN }})"
          if [ -n "${{ inputs.id }}" ]; then
            node publisher/publish-reel.mjs --id "${{ inputs.id }}" $DRY
          else
            node publisher/publish-reel.mjs --due $DRY
          fi
      - name: schedule.json 상태 커밋
        if: ${{ inputs.dry_run != true && vars.PUBLISH_DRY_RUN != 'true' }}
        run: node publisher/commit-schedule.mjs
